name: PR title

# Pull requests are squash-merged and the title becomes the commit message on
# main, so the title must follow Conventional Commits.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Dependabot writes a capital "Bump" and we cannot change that, so its
      # pull requests get the second step below instead (type still required,
      # lower-case rule dropped). The exemption keys on the pull request author,
      # which a fork cannot fake; a branch name like `dependabot/x` it could.
      # Both steps are step-level conditions, so the job and the required check
      # name `conventional title` always run and report.
      - name: Check title (everyone but Dependabot)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Subject starts lower-case and does not end with a period.
          subjectPattern: ^[a-z0-9`].*[^.]$
          subjectPatternError: |
            The subject "{subject}" must start with a lower-case letter and must
            not end with a period. Example: "feat(ui): add timeline bar".

      - name: Check title (Dependabot, type required, case not)
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Any subject without a final period; "Bump x from 1 to 2" is fine.
          subjectPattern: ^.+[^.]$
          subjectPatternError: |
            The Dependabot subject "{subject}" must not end with a period.
