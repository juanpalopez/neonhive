name: Release

# Runs when a maintainer pushes a version tag (see docs/RELEASING.md). The
# changelog is written by hand in the release pull request; this workflow only
# checks it, tests the tagged commit, builds the binaries, then publishes. It
# never pushes to main and never opens pull requests. Its only push is one
# commit to the Homebrew tap repository, and only when HOMEBREW_TAP_TOKEN is set.
#
# Order: verify -> ci -> build (all targets) -> github release -> crates.io ->
# homebrew tap. Each step starts only when everything before it succeeded, so
# a failure leaves nothing that cannot be repeated: re-running the failed jobs
# is always safe, and the irreversible crates.io publish comes after every
# step that might still need a fix and a new tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the script can test that the tagged commit is on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Runs first: a tag on a branch commit must never reach the publish jobs.
      - name: Check the tagged commit is on main
        run: scripts/check-tag-on-main.sh "$GITHUB_SHA"
      - name: Check tag, Cargo.toml and CHANGELOG.md agree
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-version.sh "$TAG"

  # fmt, clippy and tests, reused from ci.yml (it declares workflow_call).
  ci:
    name: ci
    needs: verify
    uses: ./.github/workflows/ci.yml

  # One runner per target, native where one exists, so the binary is run
  # before it ships. Build jobs have read-only access; nothing is published
  # until every target has built.
  build:
    name: build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            run: true
          # Cross-compiled on Apple silicon, so it is not run here.
          - target: x86_64-apple-darwin
            os: macos-latest
            run: false
          # Ubuntu 22.04 has the oldest glibc (2.35) on a hosted runner, so the
          # binary runs on more distributions than a 24.04 build would.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            run: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            run: true
          # Statically linked: runs on any x86_64 Linux, Alpine included.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            run: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The same script builds and packages locally; see its header.
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-release-archive.sh "$TARGET" dist
      - name: Run the packaged binary
        if: matrix.run
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          tar -xzf dist/neonhive-v*-"$TARGET".tar.gz -C "$dir"
          for bin in "$dir"/neonhive-v*-"$TARGET"/neonhive; do
            "$bin" --version
            "$bin" --demo --snapshot 5 --size 100x30 > "$dir/frame.txt"
          done
          grep -q NEONHIVE "$dir/frame.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # All five targets' archives and .sha256 files, from this run.
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub Release from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          # A suffix such as -rc.1 marks a pre-release.
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          # Re-running the workflow updates the notes instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
      - name: Upload the archives and checksums
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          # Every archive must still match the checksum its build job wrote.
          sha256sum --check --strict ./*.tar.gz.sha256
          cat ./*.tar.gz.sha256 > SHA256SUMS
          cat SHA256SUMS
          # --clobber: a re-run replaces the assets of an earlier attempt.
          gh release upload "$TAG" --clobber ./*.tar.gz ./*.tar.gz.sha256 SHA256SUMS

  # After the release and its binaries are complete: a crates.io version cannot
  # be replaced, so it comes after every step that might need a fix and a new tag.
  publish-crate:
    name: publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Skips with a notice when the secret is not set; tolerates a version
      # that is already published.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crate.sh

  # Points Formula/neonhive.rb in juanpalopez/homebrew-tap at the new tag.
  # GITHUB_TOKEN cannot push to another repository, so this uses its own
  # secret, a token limited to the tap repository. Skips with a notice when the
  # secret is not set, and for pre-releases. Safe to re-run: an unchanged
  # formula is not committed again.
  homebrew-tap:
    name: update homebrew tap
    needs: publish-crate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update the formula in the tap
        env:
          TAG: ${{ github.ref_name }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/update-homebrew-tap.sh "$TAG"
