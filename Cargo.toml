[package]
name = "neonhive"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Cyberpunk terminal UI that visualizes Claude Code agents and subagents, live or as a replay"
license = "MIT"
readme = "README.md"
repository = "https://github.com/juanpalopez/neonhive"
homepage = "https://github.com/juanpalopez/neonhive"
keywords = ["tui", "agents", "claude", "visualization", "ratatui"]
categories = ["command-line-utilities", "visualization", "development-tools"]
exclude = ["docs/demo.svg", "docs/RELEASING.md", ".github", "scripts"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
